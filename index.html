<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff8fc" />
<title>イコノイジョイ 推しタイプ診断</title>
<style>
:root{
  --bg:#f7f5fb;--paper:#fff;--ink:#1f1d27;--muted:#777281;--line:#ebe7f0;
  --love:#ed6aa6;--noteq:#68aee6;--joy:#efbb3e;--accent:#7457d7;
  --shadow:0 18px 50px rgba(50,36,74,.10);--radius:26px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(180deg,#faf9fd 0%,#f4f1f8 100%);min-height:100vh}
button,select{font:inherit}
.wrap{width:min(760px,100%);margin:auto;padding:24px 14px 56px}
.hero{text-align:center;padding:30px 8px 24px}
.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:900;color:var(--accent)}
h1{font-size:clamp(34px,9vw,58px);line-height:1.02;margin:13px 0 14px;letter-spacing:-.05em}
.grad{background:linear-gradient(100deg,var(--love),var(--accent) 48%,var(--noteq) 75%,#c99518);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:620px;margin:0 auto;color:var(--muted);font-size:14px;line-height:1.8}
.select-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.select-card.love{--group:var(--love)}.select-card.noteq{--group:var(--noteq)}.select-card.joy{--group:var(--joy)}
.group-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:900}
.group-label span:first-child{display:flex;align-items:center;gap:9px}.dot{width:11px;height:11px;border-radius:999px;background:var(--group)}
.group-label small{font-size:11px;color:var(--muted);font-weight:800}
.select-wrap{position:relative}.select-wrap:after{content:"⌄";position:absolute;right:15px;top:50%;transform:translateY(-54%);font-size:20px;pointer-events:none;color:var(--group);font-weight:900}
.member-select{width:100%;appearance:none;-webkit-appearance:none;border:2px solid #eeeaf2;border-radius:17px;background:#fff;padding:16px 44px 16px 15px;color:var(--ink);font-weight:850;outline:none;transition:.15s;cursor:pointer}
.member-select:focus,.member-select.has-value{border-color:var(--group);box-shadow:0 0 0 4px color-mix(in srgb,var(--group) 12%,transparent)}
.actionbar{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:var(--shadow)}
.chosen{font-size:12px;color:var(--muted);line-height:1.55;text-align:center;margin-bottom:10px;min-height:19px}.chosen strong{color:var(--ink)}
.diagnose{width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:950;color:#fff;background:linear-gradient(110deg,var(--love),var(--accent),var(--noteq));cursor:pointer;box-shadow:0 10px 26px rgba(116,87,215,.22);transition:.15s}
.diagnose:disabled{filter:grayscale(.8);opacity:.35;cursor:not-allowed;box-shadow:none}.diagnose:not(:disabled):active{transform:scale(.99)}
#result{display:none;margin-top:22px;scroll-margin-top:16px}#result.show{display:block;animation:pop .42s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.result-card{background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:24px;overflow:hidden}
.result-top{text-align:center;padding:7px 0 21px;border-bottom:1px solid var(--line)}
.result-kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--accent)}
.oshi-code{font-size:clamp(46px,15vw,76px);font-weight:1000;letter-spacing:.08em;line-height:1;margin:12px 0 8px}
.code-caption{font-size:12px;color:var(--muted);font-weight:800}
.type{font-size:clamp(25px,7vw,39px);margin:22px 0 8px;letter-spacing:-.04em;line-height:1.15;text-align:center}
.type-sub{color:var(--muted);line-height:1.8;margin:0 auto 18px;max-width:650px;font-size:13px;text-align:center}
.oshi-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:17px 0 24px}.oshi-chip{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:850;border:1px solid var(--line);background:#faf9fc}
.section-title{font-size:13px;font-weight:950;margin:23px 0 11px}
.axis-list{display:grid;gap:14px}.axis{background:#faf9fc;border:1px solid var(--line);border-radius:16px;padding:12px}.axis-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:900;margin-bottom:8px}.axis-head .active{color:var(--accent)}.axis-track{height:9px;border-radius:999px;background:linear-gradient(90deg,#e9e4f0 0 49.5%,#d9d1ec 49.5% 50.5%,#e9e4f0 50.5%);position:relative}.axis-dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 2px 8px rgba(50,36,74,.25);transform:translate(-50%,-50%)}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:8px 11px;border-radius:999px;background:#f1edf8;font-size:12px;font-weight:850}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.mini{background:#faf9fc;border:1px solid var(--line);border-radius:18px;padding:15px;line-height:1.75;font-size:12px}.mini b{display:block;margin-bottom:5px;font-size:12px}
.result-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.btn{flex:1;min-width:130px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font-weight:900;cursor:pointer;color:var(--ink)}.btn.primary{border:0;color:#fff;background:var(--ink)}
.code-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}.code-chip{border:1px solid var(--line);background:#faf9fc;border-radius:16px;padding:12px 8px;text-align:center}.code-letter{font-size:25px;font-weight:1000;color:var(--accent);line-height:1}.code-word{font-size:10px;font-weight:950;margin-top:7px}.code-desc{font-size:9px;color:var(--muted);line-height:1.45;margin-top:4px}.profile-box{margin:16px 0 3px;padding:16px 17px;border-radius:20px;background:linear-gradient(135deg,#f7f1ff,#fff8fb);border:1px solid #e8ddf6}.profile-box b{display:block;font-size:12px;margin-bottom:7px}.profile-box p{margin:0;font-size:12px;line-height:1.8;color:#4d4755}.axis-foot{display:flex;justify-content:space-between;margin-top:7px;font-size:9px;color:#9992a1;font-weight:800}.share-preview{margin-top:18px;border-radius:24px;padding:1px;background:linear-gradient(120deg,var(--love),var(--accent),var(--noteq),var(--joy))}.share-preview-inner{background:#fff;border-radius:23px;padding:18px;text-align:center}.share-mini-kicker{font-size:9px;letter-spacing:.14em;font-weight:950;color:var(--accent)}.share-mini-code{font-size:40px;font-weight:1000;letter-spacing:.08em;margin:7px 0 3px}.share-mini-type{font-size:16px;font-weight:950;line-height:1.35}.share-mini-members{font-size:9px;color:var(--muted);margin-top:9px;line-height:1.7}.image-btn{background:linear-gradient(110deg,var(--love),var(--accent),var(--noteq));color:#fff!important;border:0!important}.save-note{font-size:9px;color:#a39ca9;text-align:center;margin-top:8px;line-height:1.5}
.foot{margin-top:22px;text-align:center;color:#aaa3ad;font-size:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:#29242a;color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.wrap{padding:14px 10px 44px}.hero{padding-top:24px}.select-card{padding:15px}.member-select{font-size:16px;padding-block:15px}.result-card{padding:19px 14px}.grid2{grid-template-columns:1fr}.type-sub{font-size:12px}.oshi-code{letter-spacing:.045em}.code-grid{grid-template-columns:repeat(2,1fr)}.code-chip{padding:12px 10px}.share-mini-code{font-size:36px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">OSHI PERSONALITY CHECK</div>
    <h1><span class="grad">イコノイジョイ</span><br>推しタイプ診断</h1>
    <p class="lead">＝LOVE・≠ME・≒JOYから推しを1人ずつ選ぶだけ。3人の組み合わせから、あなたの「刺さる魅力」と「沼り方」を診断。</p>
  </header>

  <section class="select-card love">
    <div class="group-label"><span><i class="dot"></i>＝LOVE</span><small>1人選択</small></div>
    <div class="select-wrap"><select class="member-select" id="loveSelect" aria-label="＝LOVEの推しを選択"></select></div>
  </section>

  <section class="select-card noteq">
    <div class="group-label"><span><i class="dot"></i>≠ME</span><small>1人選択</small></div>
    <div class="select-wrap"><select class="member-select" id="noteqSelect" aria-label="≠MEの推しを選択"></select></div>
  </section>

  <section class="select-card joy">
    <div class="group-label"><span><i class="dot"></i>≒JOY</span><small>1人選択</small></div>
    <div class="select-wrap"><select class="member-select" id="joySelect" aria-label="≒JOYの推しを選択"></select></div>
  </section>

  <div class="actionbar">
    <div class="chosen" id="chosenText">3グループから1人ずつ選んでね</div>
    <button class="diagnose" id="diagnoseBtn" disabled>推しタイプを診断する</button>
  </div>

  <section id="result" aria-live="polite"></section>
  <div class="foot">IKONOIJOY OSHI TYPE CHECK</div>
</main>
<div class="toast" id="toast">コピーしたよ！</div>

<script>
// 診断軸（ファンメイド演出用）
// sparkle=王道 / gap=ギャップ / calm=落ち着き / energy=明るさ / unique=個性
// expressive=表現力 / warm=親しみ / cute=かわいさ / human=人間味
// 数値は能力評価ではなく「推し理由としての代表度」を強制分布させた診断用ウェイトです。各メンバーは100/90/75/60/45/30/20/10/5を1回ずつ使用します。
const members = {
  love: [
    {name:'大谷 映美里', s:{sparkle:90,gap:5,calm:45,energy:10,unique:75,expressive:20,warm:60,cute:100,human:30}},
    {name:'大場 花菜', s:{sparkle:5,gap:60,calm:20,energy:45,unique:90,expressive:30,warm:75,cute:10,human:100}},
    {name:'音嶋 莉沙', s:{sparkle:100,gap:10,calm:75,energy:20,unique:5,expressive:30,warm:60,cute:90,human:45}},
    {name:'齋藤 樹愛羅', s:{sparkle:30,gap:90,calm:5,energy:45,unique:75,expressive:10,warm:20,cute:100,human:60}},
    {name:'佐々木 舞香', s:{sparkle:20,gap:100,calm:75,energy:5,unique:45,expressive:90,warm:10,cute:30,human:60}},
    {name:'髙松 瞳', s:{sparkle:100,gap:20,calm:5,energy:90,unique:10,expressive:75,warm:60,cute:45,human:30}},
    {name:'瀧脇 笙古', s:{sparkle:45,gap:10,calm:75,energy:60,unique:5,expressive:20,warm:100,cute:30,human:90}},
    {name:'野口 衣織', s:{sparkle:5,gap:75,calm:10,energy:45,unique:90,expressive:100,warm:30,cute:20,human:60}},
    {name:'諸橋 沙夏', s:{sparkle:75,gap:30,calm:90,energy:5,unique:10,expressive:100,warm:20,cute:60,human:45}},
    {name:'山本 杏奈', s:{sparkle:45,gap:10,calm:60,energy:75,unique:5,expressive:20,warm:100,cute:30,human:90}}
  ],
  noteq: [
    {name:'尾木 波菜', s:{sparkle:75,gap:30,calm:5,energy:60,unique:20,expressive:10,warm:90,cute:100,human:45}},
    {name:'落合 希来里', s:{sparkle:20,gap:60,calm:5,energy:100,unique:30,expressive:10,warm:75,cute:45,human:90}},
    {name:'蟹沢 萌子', s:{sparkle:60,gap:100,calm:75,energy:5,unique:10,expressive:90,warm:45,cute:20,human:30}},
    {name:'河口 夏音', s:{sparkle:5,gap:45,calm:10,energy:90,unique:100,expressive:30,warm:60,cute:20,human:75}},
    {name:'川中子 奈月心', s:{sparkle:10,gap:90,calm:100,energy:5,unique:75,expressive:45,warm:20,cute:30,human:60}},
    {name:'櫻井 もも', s:{sparkle:75,gap:20,calm:5,energy:60,unique:10,expressive:100,warm:45,cute:90,human:30}},
    {name:'鈴木 瞳美', s:{sparkle:100,gap:5,calm:75,energy:30,unique:10,expressive:45,warm:60,cute:90,human:20}},
    {name:'谷崎 早耶', s:{sparkle:90,gap:60,calm:5,energy:30,unique:20,expressive:10,warm:75,cute:100,human:45}},
    {name:'冨田 菜々風', s:{sparkle:10,gap:90,calm:5,energy:75,unique:45,expressive:100,warm:30,cute:20,human:60}},
    {name:'永田 詩央里', s:{sparkle:10,gap:60,calm:100,energy:5,unique:90,expressive:45,warm:30,cute:20,human:75}},
    {name:'本田 珠由記', s:{sparkle:20,gap:30,calm:5,energy:45,unique:100,expressive:10,warm:60,cute:90,human:75}}
  ],
  joy: [
    {name:'逢田 珠里依', s:{sparkle:100,gap:10,calm:90,energy:20,unique:5,expressive:75,warm:45,cute:60,human:30}},
    {name:'天野 香乃愛', s:{sparkle:75,gap:20,calm:5,energy:90,unique:10,expressive:30,warm:60,cute:100,human:45}},
    {name:'市原 愛弓', s:{sparkle:20,gap:100,calm:75,energy:5,unique:60,expressive:90,warm:10,cute:30,human:45}},
    {name:'江角 怜音', s:{sparkle:5,gap:75,calm:90,energy:30,unique:60,expressive:100,warm:20,cute:10,human:45}},
    {name:'大信田 美月', s:{sparkle:10,gap:60,calm:5,energy:100,unique:45,expressive:20,warm:75,cute:30,human:90}},
    {name:'大西 葵', s:{sparkle:5,gap:45,calm:10,energy:75,unique:100,expressive:20,warm:60,cute:30,human:90}},
    {name:'小澤 愛実', s:{sparkle:45,gap:20,calm:100,energy:10,unique:5,expressive:90,warm:60,cute:30,human:75}},
    {name:'髙橋 舞', s:{sparkle:100,gap:20,calm:5,energy:60,unique:10,expressive:45,warm:75,cute:90,human:30}},
    {name:'藤沢 莉子', s:{sparkle:10,gap:45,calm:100,energy:5,unique:60,expressive:90,warm:30,cute:20,human:75}},
    {name:'村山 結香', s:{sparkle:30,gap:45,calm:90,energy:5,unique:10,expressive:75,warm:60,cute:20,human:100}},
    {name:'山田 杏佳', s:{sparkle:60,gap:10,calm:5,energy:45,unique:30,expressive:20,warm:100,cute:75,human:90}},
    {name:'山野 愛月', s:{sparkle:90,gap:60,calm:5,energy:20,unique:10,expressive:100,warm:30,cute:75,human:45}}
  ]
};

const groupMeta = {
  love:{label:'＝LOVE', color:'var(--love)'},
  noteq:{label:'≠ME', color:'var(--noteq)'},
  joy:{label:'≒JOY', color:'var(--joy)'}
};
const dims = {
  sparkle:{label:'王道',emoji:'✨'}, gap:{label:'ギャップ',emoji:'🎭'}, calm:{label:'落ち着き',emoji:'🌙'},
  energy:{label:'明るさ',emoji:'☀️'}, unique:{label:'個性',emoji:'🪩'}, expressive:{label:'表現力',emoji:'🎤'},
  warm:{label:'親しみ',emoji:'🫶'}, cute:{label:'かわいさ',emoji:'🎀'}, human:{label:'人間味',emoji:'💭'}
};
let selected = {love:null,noteq:null,joy:null};

function initials(name){ return name.replace(/\s/g,'').slice(-2); }
function renderMembers(){
  Object.entries(members).forEach(([group,list])=>{
    const select=document.getElementById(group+'Select');
    const meta=groupMeta[group];
    select.innerHTML=`<option value="">${meta.label}の推しを選ぶ</option>`+list.map((m,i)=>`<option value="${i}">${m.name.replace(/\s/g,'')}</option>`).join('');
    select.addEventListener('change',()=>{
      const index=select.value==='' ? null : Number(select.value);
      selected[group]=index===null ? null : members[group][index];
      select.classList.toggle('has-value',index!==null);
      updateAction();
    });
  });
}
function updateAction(){
  const vals=Object.values(selected), done=vals.filter(Boolean).length;
  const btn=document.getElementById('diagnoseBtn'); btn.disabled=done!==3;
  const text=document.getElementById('chosenText');
  if(done===0) text.innerHTML='3グループから1人ずつ選んでね';
  else if(done<3) text.innerHTML=`${vals.filter(Boolean).map(x=>x.name.replace(/\s/g,'')).join('・')} を選択中　あと <strong>${3-done}人</strong>`;
  else text.innerHTML=`<strong>${selected.love.name.replace(/\s/g,'')} × ${selected.noteq.name.replace(/\s/g,'')} × ${selected.joy.name.replace(/\s/g,'')}</strong>`;
}
function mean(arr){return arr.reduce((a,b)=>a+b,0)/arr.length}
function std(arr){const m=mean(arr);return Math.sqrt(mean(arr.map(v=>(v-m)**2)))}

// 前半10種：「何に惹かれるか」
const frontTypes = {
  gap:{label:'ギャップに弱い',copy:'予想外の一面や、普段とステージの落差が見えた瞬間に一気に刺さりやすい。'},
  sparkle:{label:'王道を愛する',copy:'華やかさや「アイドルしてる！」感を真正面から楽しめる。'},
  unique:{label:'個性に惹かれる',copy:'その人にしかないキャラ、言葉、空気感を見つけると急に気になり始める。'},
  expressive:{label:'表現力に撃ち抜かれる',copy:'歌・ダンス・表情など、ステージ上で空気を変える瞬間に弱い。'},
  warm:{label:'親しみやすさを好む',copy:'距離の近さや安心感、人との関わり方まで含めて好きになりやすい。'},
  calm:{label:'落ち着いた魅力に惹かれる',copy:'派手さだけでなく、静かな存在感や細かい仕草をじっくり拾う。'},
  energy:{label:'明るさに弱い',copy:'見ているだけで気分が上がる、ポジティブなエネルギーに惹かれやすい。'},
  cute:{label:'かわいさを求める',copy:'ビジュアル、仕草、声、愛嬌など「かわいい」の供給に素直に弱い。'},
  human:{label:'人間味に惹かれる',copy:'完璧さだけではなく、素っぽさや不器用さ、リアクションまで魅力として拾う。'},
  broad:{label:'幅広い魅力を拾う',copy:'グループごとに違うベクトルの良さを見つけられる。推しを一つの系統に固定しない。'}
};

// 後半12種：「どう沼るか」
const backTypes = {
  observer:{label:'観察者タイプ',copy:'一発の派手さより、表情や言葉の細部を見つけて好きが積み上がる。'},
  diver:{label:'沼ダイバータイプ',copy:'「気になる」が始まると関連動画や過去エピソードまで一気に潜っていく。'},
  allaffirm:{label:'全肯定タイプ',copy:'好きになった後は供給そのものが嬉しい。推しがアイドルしているだけで満足度が高い。'},
  watcher:{label:'見守りタイプ',copy:'活躍や成長を長く追うほど愛着が増す。推しの幸せまで気になりがち。'},
  stage:{label:'ステージ至上主義タイプ',copy:'最終的な決定打はライブやパフォーマンス。ステージを見るたび推し度が更新される。'},
  gradual:{label:'じわじわ沼タイプ',copy:'初見で即決というより、何度も見るうちに「この子めっちゃ良くない？」が育つ。'},
  first:{label:'第一印象直撃タイプ',copy:'最初の数秒でビジュアルや空気感にロックオンされやすい。入口の火力が強い。'},
  researcher:{label:'深掘り研究家タイプ',copy:'好きな理由を自分なりに言語化したくなる。推しの細かい魅力を語り始めると長い。'},
  empathy:{label:'感情移入タイプ',copy:'素の感情や頑張りが見えるほど応援したくなる。ストーリー込みで推しが深くなる。'},
  recharge:{label:'元気チャージタイプ',copy:'推しを見ること自体が回復アイテム。明るい供給で日常のHPを戻す。'},
  collector:{label:'コレクタータイプ',copy:'同じ系統を集めるより、その子にしかない魅力を一人ずつ見つけて推す。'},
  tossed:{label:'振り回されたいタイプ',copy:'予測不能な発言やギャップもご褒美。次に何をしてくるか分からない人ほど楽しい。'}
};

function computeBaselines(){
  const all=[...members.love,...members.noteq,...members.joy];
  const base={};
  Object.keys(dims).forEach(k=>{
    const vals=all.map(m=>m.s[k]);
    base[k]={mean:mean(vals),sd:Math.max(std(vals),8)};
  });
  return base;
}

function getDiagnosis(picks,comboIndex){
  const keys=Object.keys(dims);
  const avg={}; const z={};
  keys.forEach(k=>{
    avg[k]=Math.round(mean(picks.map(p=>p.s[k])));
    z[k]=(avg[k]-baselines[k].mean)/baselines[k].sd;
  });
  const diversity=mean(keys.map(k=>std(picks.map(p=>p.s[k]))));
  const ranked=[...keys].sort((a,b)=>z[b]-z[a]);

  // v4ではタイトルの前半と後半を独立採点し、全1,320組の中で120/120種類が
  // 実際に出現するよう事前校正した割り当てを使用する。本文の共通特徴は従来通り実スコアから算出。
  const calibrated=calibratedTypeFor(comboIndex.love,comboIndex.noteq,comboIndex.joy);
  const frontKey=calibrated.frontKey;
  const backKey=calibrated.backKey;
  const secondary=(frontKey==='broad') ? ranked[0] : (ranked.find(k=>k!==frontKey) || ranked[1]);

  return {avg,z,diversity,ranked,frontKey,backKey,secondary};
}

function getOshiCode(d){
  const a=d.avg;
  const bias={first:0,gradual:0,stage:0,human:0,classic:0,unique:0,observe:0,empathy:0};
  bias.first=(a.cute+a.sparkle+a.energy)/3;
  bias.gradual=(a.calm+a.human+a.gap)/3;
  bias.stage=(a.expressive+a.sparkle)/2;
  bias.human=(a.human+a.warm)/2;
  bias.classic=(a.sparkle+a.cute)/2;
  bias.unique=(a.unique+a.gap)/2;
  bias.observe=(a.calm+a.gap+a.unique)/3;
  bias.empathy=(a.human+a.warm+a.energy)/3;
  const backBoost={first:['first'],gradual:['gradual'],stage:['stage'],observer:['observe'],researcher:['observe'],empathy:['empathy'],watcher:['empathy'],recharge:['empathy'],tossed:['unique'],collector:['unique'],allaffirm:['classic'],diver:['gradual']};
  (backBoost[d.backKey]||[]).forEach(k=>bias[k]+=12);
  const axes=[
    {left:'F',leftLabel:'第一印象',right:'D',rightLabel:'じわ沼',lv:bias.first,rv:bias.gradual},
    {left:'S',leftLabel:'ステージ',right:'H',rightLabel:'人柄',lv:bias.stage,rv:bias.human},
    {left:'C',leftLabel:'王道',right:'U',rightLabel:'個性',lv:bias.classic,rv:bias.unique},
    {left:'O',leftLabel:'観察',right:'E',rightLabel:'感情移入',lv:bias.observe,rv:bias.empathy}
  ].map(x=>{
    const total=Math.max(x.lv+x.rv,1); const rightPct=Math.round(x.rv/total*100);
    const winner=x.lv>=x.rv?x.left:x.right;
    return {...x,rightPct,winner};
  });
  return {code:axes.map(x=>x.winner).join(''),axes};
}

function resultText(){
  const d=window.lastDiagnosis;
  return `イコノイジョイ推しタイプ診断\n\n＝LOVE：${selected.love.name}\n≠ME：${selected.noteq.name}\n≒JOY：${selected.joy.name}\n\n推しコード：${d.oshiProfile.code}\n診断結果：${d.type.title}\n刺さりポイント：${d.common.join(' / ')}\n\n#イコノイジョイ推しタイプ診断`;
}
async function shareResult(){
  const text=resultText();
  if(navigator.share){try{await navigator.share({title:'イコノイジョイ 推しタイプ診断',text});return}catch(e){if(e.name==='AbortError')return}}
  await copy(text);
}
async function copyResult(){await copy(resultText())}
async function copy(text){
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400);
}

document.getElementById('diagnoseBtn').addEventListener('click',diagnose);
renderMembers(); updateAction();
